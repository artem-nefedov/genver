# GoReleaser configuration.
#
# The release version is computed by givi itself and injected via the
# COMPUTED_VERSION environment variable (see the release workflow); the
# version GoReleaser would otherwise derive from `git describe` is ignored. All
# binaries are compiled with CGO disabled.
version: 2

project_name: givi

# In snapshot mode (used by `make release-preview`) GoReleaser ignores
# COMPUTED_VERSION and would otherwise stamp a "0.0.0-SNAPSHOT" version.
# Since givi passes its own computed version in that env var, reuse it here so
# the preview binary reports the real version.
snapshot:
  version_template: "{{ .Env.COMPUTED_VERSION }}"

before:
  hooks:
    - go mod tidy

builds:
  - id: givi
    main: .
    binary: givi
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # {{ .Version }} resolves to COMPUTED_VERSION without "v" prefix.
      - -s -w -X main.version=v{{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: givi
    ids:
      - givi
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{- else }}{{ .Os }}{{ end }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# Multi-arch image builds. GoReleaser drops the matching prebuilt binary into
# the build context, so the Dockerfiles only COPY it in (no in-image
# compilation). dockers_v2 builds both architectures and the multi-arch manifest
# in one entry. Two flavours are produced: a scratch image and an Alpine image.
dockers_v2:
  # --- scratch (minimal) ---
  - id: scratch
    dockerfile: Dockerfile
    images:
      - ghcr.io/artem-nefedov/givi
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/artem-nefedov/givi"

  # --- Alpine ---
  - id: alpine
    dockerfile: Dockerfile.alpine
    images:
      - ghcr.io/artem-nefedov/givi
    tags:
      - "{{ .Version }}-alpine"
      - latest-alpine
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/artem-nefedov/givi"

release:
  github:
    owner: artem-nefedov
    name: givi

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
