version: 2

project_name: genver

before:
  hooks:
    - go mod tidy

builds:
  - id: genver
    main: .
    binary: genver
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # The release version is computed by genver itself.
      - -s -w -X main.version=v{{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: genver
    ids:
      - genver
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{- else }}{{ .Os }}{{ end }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# Multi-arch image builds. GoReleaser drops the matching prebuilt binary into
# the build context, so the Dockerfiles only COPY it in (no in-image compilation).
# Two flavours are produced: a scratch image and an Alpine image.
dockers_v2:
  # --- scratch (minimal) ---
  - id: scratch
    dockerfile: Dockerfile
    images:
      - ghcr.io/artem-nefedov/genver
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/artem-nefedov/genver"

  # --- Alpine ---
  - id: alpine
    dockerfile: Dockerfile.alpine
    images:
      - ghcr.io/artem-nefedov/genver
    tags:
      - "{{ .Version }}-alpine"
      - latest-alpine
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/artem-nefedov/genver"

release:
  github:
    owner: artem-nefedov
    name: genver

changelog:
  use: github
  sort: asc
